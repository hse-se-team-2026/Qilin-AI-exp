// qilin.ucfs: Kotlin module that runs UCFS (org.ucfs:solver, GLL over RSM) for Qilin.
// It depends on qilin.core only, never on qilin.pta: qilin.pta will depend on this module (E2-S4).
// The root build.gradle applies java, the Java 21 toolchain and publishing to every subproject;
// the Kotlin plugin takes the same toolchain.
plugins {
    // Same Kotlin as the solver (its POM pins kotlin-stdlib 2.4.0). KGP 2.4.0 warns that
    // Gradle 8.12 is deprecated for Kotlin 2.5.0; the wrapper stays 8.12 (E2.md D3).
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

// UCFS comes from the project-local Maven repository filled by scripts/ucfs/bootstrap.sh
// (default .ucfs/m2; -PucfsRepo=<dir> points elsewhere), as in qilin.pta/build.gradle.
// Version: ucfsVersion in gradle.properties.
def ucfsRepo = rootProject.file(findProperty('ucfsRepo') ?: '.ucfs/m2')
if (!new File(ucfsRepo, "org/ucfs/solver/${ucfsVersion}").isDirectory()) {
    logger.warn("UCFS org.ucfs:solver:${ucfsVersion} is not in ${ucfsRepo}: " +
            "run 'bash scripts/ucfs/bootstrap.sh' (see README.md)")
}

// cfl-idr-with-gll (org.cfl_idr_with_gll:cfl-idr-with-gll, interleaved Dyck reachability on UCFS) comes from
// the project-local Maven repository filled by scripts/cflidr/bootstrap.sh (default .cflidr/m2;
// -PcflidrRepo=<dir> points elsewhere). Version: cflidrVersion in scripts/cflidr/cflidr.properties, not in
// gradle.properties: it is the same string as ucfsVersion, which is declared in one build file only (E1-S4).
def cflidrRepo = rootProject.file(findProperty('cflidrRepo') ?: '.cflidr/m2')
def cflidrProps = new Properties()
rootProject.file('scripts/cflidr/cflidr.properties').withInputStream { cflidrProps.load(it) }
def cflidrVersion = cflidrProps.getProperty('cflidrVersion')
if (!new File(cflidrRepo, "org/cfl_idr_with_gll/cfl-idr-with-gll/${cflidrVersion}").isDirectory()) {
    logger.warn("cfl-idr org.cfl_idr_with_gll:cfl-idr-with-gll:${cflidrVersion} is not in ${cflidrRepo}: " +
            "run 'bash scripts/cflidr/bootstrap.sh' (see README.md)")
}

repositories {
    google()   // Soot needs com.android.tools.smali:smali-dexlib2
    maven { url = "https://repo.maven.apache.org/maven2/" }
    // org.ucfs is resolved only from ucfsRepo, and ucfsRepo serves nothing else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ucfsRepo'
                url = ucfsRepo.toURI()
            }
        }
        filter {
            includeGroup 'org.ucfs'
        }
    }
    // org.cfl_idr_with_gll is resolved only from cflidrRepo, and cflidrRepo serves nothing else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'cflidrRepo'
                url = cflidrRepo.toURI()
            }
        }
        filter {
            includeGroup 'org.cfl_idr_with_gll'
        }
    }
}

dependencies {
    // api: qilin.core types (PTA, pag.Node) are in the signatures of QilinPagSeam and PagEdge (E2-S5).
    api(project(':qilin.core'))
    // qilin.core keeps Soot as implementation, so Soot types need their own declaration here.
    implementation("org.soot-oss:soot:${rootProject.ext.sootVersion}")
    // api: org.ucfs.grammar.combinator.Grammar is in the signatures of UcfsSolver and AnBnGrammar.
    // logback-classic is excluded: through it Soot would log at DEBUG level in Qilin.
    api("org.ucfs:solver:${ucfsVersion}") {
        exclude group: 'ch.qos.logback'
    }
    // api: the qilin.pta tests call org.cfl_idr_with_gll.* (getUnderApprox, getMROverApprox, ...) directly.
    // Its org.ucfs:solver dependency is the solver above (bootstrap.sh compiles it against .ucfs/m2), so
    // the class path has one UCFS; logback is excluded on this path too.
    api("org.cfl_idr_with_gll:cfl-idr-with-gll:${cflidrVersion}") {
        exclude group: 'ch.qos.logback'
    }
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}
