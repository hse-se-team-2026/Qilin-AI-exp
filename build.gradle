buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'java'
    id "com.dorongold.task-tree" version "1.4"
}

group 'qilin'
// version format: major.minor.patch
version '0.9.9-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The root project resolves runtimeClasspath (what fatJar packs) with its own repositories, so it
// needs ucfsRepo too: org.ucfs:solver comes through qilin.pta -> qilin.ucfs. Same repository as in
// qilin.pta/qilin.ucfs: .ucfs/m2 filled by scripts/ucfs/bootstrap.sh, or -PucfsRepo=<dir>.
def ucfsRepo = rootProject.file(findProperty('ucfsRepo') ?: '.ucfs/m2')

repositories {
    google()
    mavenCentral()
    // org.ucfs is resolved only from ucfsRepo, and ucfsRepo serves nothing else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ucfsRepo'
                url = ucfsRepo.toURI()
            }
        }
        filter {
            includeGroup 'org.ucfs'
        }
    }
}

dependencies {
    implementation(project(':qilin.pta'))
    implementation(project(':qilin.core'))
    implementation(project(':qilin.util'))
    testImplementation group: 'junit', name: 'junit', version: '4.13'
}

ext {
    sootVersion = '4.7.1'
}

tasks.register('fatJar', Jar) {
    dependsOn(tasks.named('build'))
    // The from { } closure below hides from Gradle which tasks build the files it unpacks, so
    // depend on the configuration itself: that schedules the subproject jar tasks (:qilin.pta:jar,
    // :qilin.ucfs:jar, :qilin.core:jar, :qilin.util:jar) and the jar is packed from fresh classes,
    // also after clean and with -x test.
    dependsOn(configurations.runtimeClasspath)
    manifest {
        attributes 'artifact': 'qilin',
                'Version': getArchiveVersion(),
                'Main-Class': 'driver.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
    doLast {
        copy {
            from "${layout.buildDirectory.get()}/libs/${archiveBaseName.get()}-${getArchiveVersion().get()}.jar"
            into "$rootDir/artifact/"
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'

    group rootProject.group
    version rootProject.version

    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set('sources')
        from(sourceSets.main.allSource)
    }

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set('javadoc')
        from(javadoc.destinationDir)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
            // vendor = JvmVendorSpec.ADOPTIUM
        }
    }
    publishing.publications {
        qilin(MavenPublication) {
            artifactId = artifactId.substring(6)
            from components.java
            artifact sourcesJar
            artifact javadocJar
        }
    }

    publishing.repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/QiLinPTA/QiLin"
            credentials {
                username = project.findProperty("gpr.user") ?: "QiLinPTA"
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
}
