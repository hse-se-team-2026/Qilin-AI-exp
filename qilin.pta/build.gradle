plugins {
    id 'java-library'
}

sourceSets.main {
    java.srcDirs = ['src']
}

sourceSets.test {
    java.srcDirs = ['test']
}

// UCFS (org.ucfs:solver) comes from a project-local Maven repository filled by
// scripts/ucfs/bootstrap.sh (default .ucfs/m2; -PucfsRepo=<dir> points elsewhere).
// Version and pinned commit: ucfsVersion / ucfsCommit in gradle.properties.
def ucfsRepo = rootProject.file(findProperty('ucfsRepo') ?: '.ucfs/m2')
if (!new File(ucfsRepo, "org/ucfs/solver/${ucfsVersion}").isDirectory()) {
    logger.warn("UCFS org.ucfs:solver:${ucfsVersion} is not in ${ucfsRepo}: " +
            "run 'bash scripts/ucfs/bootstrap.sh' (see README.md)")
}

repositories {
    google()
    maven { url "https://repo.maven.apache.org/maven2/" }
    maven { url "https://repo1.maven.org/maven2/" }
    // org.ucfs is resolved only from ucfsRepo, and ucfsRepo serves nothing else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'ucfsRepo'
                url = ucfsRepo.toURI()
            }
        }
        filter {
            includeGroup 'org.ucfs'
        }
    }
}

test {
    useJUnit()
    maxHeapSize = '4096m'
}

dependencies {
    implementation("org.soot-oss:soot:${rootProject.ext.sootVersion}")
    implementation(project(':qilin.core'))
    // https://mvnrepository.com/artifact/commons-cli/commons-cli
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.7.0'
    implementation group: 'com.google.guava', name: 'guava', version: '33.2.0-jre'
    // Kotlin module running UCFS (E2.md D2: qilin.pta -> qilin.ucfs -> qilin.core, never back).
    // It exports org.ucfs:solver as api, with logback-classic excluded.
    implementation(project(':qilin.ucfs'))
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    // UCFS solver declared directly for the E1 smoke test (UcfsDependencySmokeTest).
    testImplementation "org.ucfs:solver:${ucfsVersion}"
}

